[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rupiah-parse-id"
version = "0.1.0"
description = "Parser presisi untuk nilai Rupiah dengan format angka Indonesia"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rupiah-parse-id contributors" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
rupiah-parse-id = "rupiah_parse_id.core:main"

[tool.setuptools.packages.find]
where = ["src"]
